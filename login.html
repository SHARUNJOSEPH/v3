<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LED Grid Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent: #0d6efd;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 800px at 10% 10%, rgba(13,110,253,0.15), transparent),
                        radial-gradient(1200px 800px at 90% 90%, rgba(32,201,151,0.12), transparent),
                        var(--bg-color);
            color: var(--text-color);
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            margin-top: 10vh;
        }
        .card {
            backdrop-filter: blur(6px);
            background: rgba(52, 58, 64, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 12px 30px -18px rgba(13,110,253,0.6);
            border-radius: 16px;
            transition: transform .15s ease, box-shadow .2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -18px rgba(13,110,253,0.7); }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #16a085); border: 0; box-shadow: 0 10px 24px -12px rgba(13,110,253,0.7); }
        .form-control { background-color: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); color: #e9ecef; }
        .form-label { color: #e9ecef; }
    </style>
</head>
<body class="dark-mode" style="--bg-color: #212529; --text-color: #e9ecef; --card-bg: #343a40; --border-color: #495057;">
    <div class="container login-container">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Login</h3>
                <form id="emailLoginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="text-center mt-3">
                    <hr>
                    <button id="googleBtn" class="btn btn-outline-light w-100">Continue with Google</button>
                    <hr>
                    <a href="index.html">Back to Generator</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCRiYz5iOnQVfJzwnt43F0FRSlEwRWtbYY",
            authDomain: "sharun-82f70.firebaseapp.com",
            projectId: "sharun-82f70",
            storageBucket: "sharun-82f70.firebasestorage.app",
            messagingSenderId: "859714949699",
            appId: "1:859714949699:web:0b2ce526b16ba6aabdfaf6",
            measurementId: "G-GYBFKRM6PD"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const redirectToApp = () => window.location.href = 'index.html';

        // Email/password login
        document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                redirectToApp();
            } catch (err) {
                if (err.code === 'auth/user-not-found') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        redirectToApp();
                    } catch (createErr) {
                        alert(createErr.message);
                    }
                } else {
                    alert(err.message);
                }
            }
        });

        // Google sign-in
        document.getElementById('googleBtn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                redirectToApp();
            } catch (err) {
                alert(err.message);
            }
        });

        // Already signed in? Go back
        onAuthStateChanged(auth, user => {
            if (user) {
                redirectToApp();
            }
        });
    </script>
    <div style="position: fixed; bottom: 10px; right: 10px;">
        <select id="languageSelector" class="form-select form-select-sm">
            <option value="en" selected>English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
        </select>
    </div>
    <script>
        document.getElementById('languageSelector').addEventListener('change', function() {
            var selectedLanguage = this.value;
            // Here you would implement the logic to change the language of the page.
            alert('Language selected: ' + this.options[this.selectedIndex].text);
        });
    </script>
</body>
</html>
