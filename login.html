<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LED Grid Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent: #0d6efd;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 800px at 10% 10%, rgba(13,110,253,0.15), transparent),
                        radial-gradient(1200px 800px at 90% 90%, rgba(32,201,151,0.12), transparent),
                        var(--bg-color);
            color: var(--text-color);
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            margin-top: 10vh;
        }
        .card {
            backdrop-filter: blur(6px);
            background: rgba(52, 58, 64, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 12px 30px -18px rgba(13,110,253,0.6);
            border-radius: 16px;
            transition: transform .15s ease, box-shadow .2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -18px rgba(13,110,253,0.7); }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #16a085); border: 0; box-shadow: 0 10px 24px -12px rgba(13,110,253,0.7); }
        .form-control { background-color: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); color: #e9ecef; }
        .form-label { color: #e9ecef; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body class="dark-mode" style="--bg-color: #212529; --text-color: #e9ecef; --card-bg: #343a40; --border-color: #495057;">
    <div class="container login-container">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Login</h3>
                <form id="emailLoginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="text-center mt-3">
                    <hr>
                    <button id="googleBtn" class="btn btn-outline-light w-100">Continue with Google</button>
                    <hr>
                    <a href="index.html">Back to Generator</a>
                </div>
            </div>
        </div>
    </div>
    <script>
                    // 1) Initialize Firebase (replace placeholders with your config)
                    const firebaseConfig = {
                        apiKey: "YOUR_API_KEY",
                        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                        projectId: "YOUR_PROJECT_ID",
                        appId: "YOUR_APP_ID",
                    };
                    let isDemo = !firebaseConfig.apiKey || String(firebaseConfig.apiKey).includes('YOUR_') || firebaseConfig.projectId === 'YOUR_PROJECT_ID';
                    try { if (!isDemo) { firebase?.apps?.length ? null : firebase.initializeApp(firebaseConfig); } } catch { isDemo = true; }
                    const auth = isDemo ? null : firebase.auth();

                    const redirectToApp = () => window.location.href = 'index.html';

                    // 2) Email/password login
                    document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const email = document.getElementById('email').value.trim();
                        const password = document.getElementById('password').value;
                        if (!isDemo) {
                            try {
                                await auth.signInWithEmailAndPassword(email, password);
                                redirectToApp();
                            } catch (err) {
                                if (err.code === 'auth/user-not-found') {
                                    await auth.createUserWithEmailAndPassword(email, password);
                                    redirectToApp();
                                } else {
                                    alert(err.message);
                                }
                            }
                        } else {
                            // Local demo auth
                            if (email === 'admin@gmail.com' && password === 'admin') {
                                try { localStorage.setItem('demoAuthUser', JSON.stringify({ email })); } catch { }
                                try { window.opener?.__demoLogin?.(email); } catch { }
                                try { window.__demoLogin?.(email); } catch { }
                                redirectToApp();
                            } else {
                                alert('Invalid credentials for local demo. Use admin@gmail.com / admin');
                            }
                        }
                });

                    // 3) Google sign-in
                    document.getElementById('googleBtn').addEventListener('click', async () => {
                        if (isDemo) { alert('Google sign-in is disabled in local demo mode.'); return; }
                        const provider = new firebase.auth.GoogleAuthProvider();
                        try {
                        await auth.signInWithPopup(provider);
                        redirectToApp();
                    } catch (err) { alert(err.message); }
                });

                        // 4) Already signed in? Go back
                        if (!isDemo) auth.onAuthStateChanged(user => { if (user) redirectToApp(); });
    </script>
    <div style="position: fixed; bottom: 10px; right: 10px;">
        <select id="languageSelector" class="form-select form-select-sm">
            <option value="en" selected>English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
        </select>
    </div>
    <script>
        document.getElementById('languageSelector').addEventListener('change', function() {
            var selectedLanguage = this.value;
            // Here you would implement the logic to change the language of the page.
            alert('Language selected: ' + this.options[this.selectedIndex].text);
        });
    </script>
</body>
</html>
